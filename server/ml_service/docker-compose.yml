# server/ml_service/docker-compose.yml
version: "3.8"

services:
  python-ml-service:
    build:
      context: ./..
      dockerfile: ml_service/Dockerfile
    container_name: senken-python-ml
    ports:
      - "8001:8000" # Changed to 8001 to avoid conflict with Node.js
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LOCAL_MODEL_PATH=/app/models/model.gguf
      - ML_MODEL_DIR=/app/ml_model
    volumes:
      # Mount models directory for persistent storage
      - ./models:/app/models
      # Mount ml_model for development (optional)
      - ./ml_model:/app/ml_model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
